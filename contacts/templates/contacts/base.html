<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Raccourcis WhatsApp{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%2325d366'/%3E%3Cpath d='M22 18c-2 1-4 4-3 8 2 9 10 17 19 19 4 1 7-1 8-3l-6-5-4 3c-4-2-8-6-10-10l3-4z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root { --green: #128c7e; --green-2: #25d366; --ink: #17212b; --muted: #667781;
          --line: #e3e8eb; --bg: #f3f5f6; --card: #fff; --danger: #c0392b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--green); color: #fff; padding: 14px 16px;
           padding-top: calc(14px + env(safe-area-inset-top, 0px));
           display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header h1 { font-size: 1.1rem; margin: 0; font-weight: 650; }
  header a, header button { color: #fff; background: none; border: 0; font: inherit;
                            font-size: .9rem; text-decoration: underline; cursor: pointer; padding: 0; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  .msg { padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; background: #e7f6ec; }
  .msg.warning, .msg.error { background: #fff4d6; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
         min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line);
         background: var(--card); color: var(--ink); font: inherit; font-weight: 600;
         text-decoration: none; cursor: pointer; }
  .btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.danger { color: var(--danger); }
  .btn.block { display: flex; width: 100%; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  input[type=text], input[type=tel], input[type=password], select {
    width: 100%; min-height: 46px; padding: 0 12px; border: 1px solid #c9d1d6;
    border-radius: 10px; font: inherit; background: #fff; color: var(--ink); }
  .hint { color: var(--muted); font-size: .88rem; margin-top: 4px; }
  .error { color: var(--danger); font-weight: 600; margin: 12px 0 0; }
  {% block css %}{% endblock %}
</style>
</head>
<body>
<header>
  <h1>{% block heading %}Raccourcis WhatsApp{% endblock %}</h1>
  {% block header_action %}{% endblock %}
</header>
<main>
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
{% block js %}{% endblock %}
</body>
</html>
